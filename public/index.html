<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoangWER Key System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <div class="logo">HW</div>
  <h1>HoangWER</h1>
  <p class="sub">KEY SYSTEM • 24 HOURS</p>

  <button id="getKey">🔑 GET KEY</button>

  <div id="status" class="status"></div>

  <section id="keyBox" class="hidden">
    <div class="label">YOUR KEY</div>
    <div class="keyrow">
      <code id="key"></code>
      <button id="copy" class="copy">COPY</button>
    </div>
    <div id="timer" class="timer"></div>
  </section>

  <hr>

  <div class="label">VERIFY KEY</div>
  <input id="verifyInput" placeholder="Nhập key..." autocomplete="off">
  <button id="verify">VERIFY</button>
  <div id="verifyMsg"></div>

  <p class="note">
    Bấm GET KEY để sao chép link Lootdest. Sau khi hoàn thành,
    quay lại trang này để nhận key.
  </p>
</main>
<script src="script.js"></script>
</body>
</html>
